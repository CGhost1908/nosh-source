        .doc-body .table-container {

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.add('visible');
            setTimeout(() => { toast.classList.remove('visible'); }, 2000);
        }

        function copyShareUrl() {
            navigator.clipboard.writeText(window.location.href)
                .then(() => showToast('Share link copied to clipboard'))
                .catch(() => alert('Failed to copy link.'));
        }

        // Shared notes are written by anyone who can publish, so their HTML is untrusted.
        // Strip scripts, event handlers and javascript: URLs before it touches the DOM.
        // If the sanitizer failed to load, fail closed and show the raw markup as plain text.
        let purifyIconHookRegistered = false;
        function ensureDomPurifyHooks() {
            if (purifyIconHookRegistered || !window.DOMPurify || typeof window.DOMPurify.addHook !== 'function') return;
            window.DOMPurify.addHook('uponSanitizeAttribute', (node, data) => {
                if (node && node.tagName === 'ICONIFY-ICON' && data && data.attrName === 'icon') {
                    if (/^[a-z0-9_-]+:[a-z0-9_-]+$/i.test(String(data.attrValue || '').trim())) {
                        data.forceKeepAttr = true;
                    } else {
                        data.keepAttr = false;
                    }
                }
            });
            purifyIconHookRegistered = true;
        }

        function sanitizeNoteHTML(html) {
            if (!window.DOMPurify) return null;
            ensureDomPurifyHooks();
            return window.DOMPurify.sanitize(html || '', {
                ADD_TAGS: ['source', 'iconify-icon'],
                ADD_ATTR: ['language', 'icon'],
                FORBID_TAGS: ['style', 'form', 'iframe', 'object', 'embed'],
                FORBID_ATTR: ['srcdoc', 'formaction']
            });
        }

        function renderNoteBody(container, rawHtml) {
            let contentToRender = rawHtml || '';
            if (typeof isRawMarkdownDocument === 'function' && isRawMarkdownDocument(contentToRender)) {
                contentToRender = convertRawMarkdownToHtml(contentToRender);
            }
            const safeHtml = sanitizeNoteHTML(contentToRender);
            if (safeHtml === null) {
                console.error('DOMPurify unavailable; rendering note as plain text.');
                container.textContent = contentToRender || '';
                return;
            }
            container.innerHTML = safeHtml;
            initInteractiveElements(container);
        }

            { name: 'React', mode: 'javascript', icon: 'logos:react', aliases: ['react', 'jsx', 'tsx'] },
            { name: 'Lua', mode: 'lua', icon: 'logos:lua', aliases: ['lua'] },
            { name: 'R', mode: 'r', icon: 'logos:r-lang', aliases: ['r'] }
        ];

        function getViewerLanguageMeta(raw) {
            const cleaned = String(raw || '').trim();
            const lower = cleaned.toLowerCase();
            if (!lower) {
                return { name: 'JavaScript', mode: 'javascript', icon: 'logos:javascript' };
            }
            const exact = VIEWER_LANGUAGES.find(l =>
                l.name.toLowerCase() === lower ||
                l.mode.toLowerCase() === lower ||
                l.aliases.includes(lower)
            );
            if (exact) return exact;
            const partial = VIEWER_LANGUAGES.find(l =>
                l.aliases.some(a => a.length > 1 && lower.includes(a))
            );
            if (partial) return partial;
            return { name: cleaned, mode: 'javascript', icon: 'solar:code-square-linear' };
        }

        function mapLanguageMode(raw) {
            return getViewerLanguageMeta(raw).mode;
        }

        function buildViewerCodeHeader(rawLang) {
            const meta = getViewerLanguageMeta(rawLang);
            const header = document.createElement('div');
            header.className = 'code-block-header';
            header.innerHTML = `
                <div class="code-header-left">
                    <div class="code-window-dots">
                        <span class="code-dot red"></span>
                        <span class="code-dot yellow"></span>
                        <span class="code-dot green"></span>
                    </div>
                    <span class="code-lang-tag">
                        <iconify-icon class="lang-icon"></iconify-icon>
                        <span class="lang-name"></span>
                    </span>
                </div>
                <div class="code-block-actions">
                    <button class="code-action-btn copy-btn" title="Copy Code"><iconify-icon icon="solar:copy-linear"></iconify-icon> Copy</button>
                </div>
            `;
            header.querySelector('.lang-icon').setAttribute('icon', meta.icon);
            header.querySelector('.lang-name').textContent = meta.name;
            return header;
        }

        function upgradeLegacyBlocksInDOM(container) {
            const legacyLayers = container.querySelectorAll('.code-block-layer');
            legacyLayers.forEach(layer => {
                const parent = layer.parentElement;
                const ta = parent ? parent.querySelector('textarea.code') : null;
                if (!ta) return;

                const langP = layer.querySelector('p');
                const rawLang = (langP ? langP.textContent.trim() : '') || ta.getAttribute('language') || 'javascript';

                let code = ta.value || '';
                if (!code) {
                    const deadCM = parent.querySelector('.CodeMirror');
                    if (deadCM) {
                        const lines = deadCM.querySelectorAll('.CodeMirror-line');
                        if (lines && lines.length > 0) {
                            code = Array.from(lines).map(l => l.textContent).join('\n');
                        }
                    }
                }
                if (!code) code = ta.textContent || '';

                const wrapper = document.createElement('div');
                wrapper.className = 'code-block-wrapper';

                const header = buildViewerCodeHeader(rawLang);

                const newTa = document.createElement('textarea');
                newTa.className = 'code';
                newTa.setAttribute('language', rawLang);
                newTa.value = code;
                newTa.textContent = code;

                wrapper.appendChild(header);
                wrapper.appendChild(newTa);

                if (parent === container) {
                    layer.remove();
                    ta.replaceWith(wrapper);
                } else {
                    parent.replaceWith(wrapper);
                }
            });

            container.querySelectorAll('.code-block-wrapper .CodeMirror, .media-toolbar, .media-resize-handle').forEach(el => el.remove());
        }

        async function fetchPublishedNote() {
            const params = new URLSearchParams(window.location.search);
            const noteId = params.get('id');

            const loadingEl = document.getElementById('loading-state');
            const errorEl = document.getElementById('error-state');
            const articleEl = document.getElementById('note-article');
            const navTitle = document.getElementById('nav-title');
            const noteBody = document.getElementById('note-body');
            const docDate = document.getElementById('doc-date');

            if (!noteId) {
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                document.getElementById('error-title').textContent = 'No Document Specified';
                document.getElementById('error-desc').textContent = 'Please provide a valid document link with a note ID.';
                return;
            }

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/shared_notes?id=eq.${encodeURIComponent(noteId)}&select=id,title,content,created_at`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`Failed to load note (HTTP ${response.status})`);
                }

                const data = await response.json();
                if (!data || data.length === 0) {
                    loadingEl.style.display = 'none';
                    errorEl.style.display = 'block';
                    document.getElementById('error-title').textContent = 'Note Not Found';
                    document.getElementById('error-desc').textContent = 'The note you are looking for does not exist or may have expired.';
                    return;
                }

                const note = data[0];
                document.title = `${note.title || 'Note'} — Nosh`;
                if (navTitle) navTitle.textContent = note.title || 'Untitled';

                if (docDate && note.created_at) {
                    const d = new Date(note.created_at);
                    docDate.textContent = `Published on ${d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })}`;
                }

                loadingEl.style.display = 'none';
                articleEl.style.display = 'block';

                if (noteBody) {
                    renderNoteBody(noteBody, note.content);
                }

            } catch (err) {
                console.error('Error fetching note:', err);
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                document.getElementById('error-title').textContent = 'Connection Error';
                document.getElementById('error-desc').textContent = err.message || 'Unable to connect to Supabase Cloud.';
            }
        }

        // --- Table & Markdown Processing for Published Notes ---
        function splitMarkdownTableRow(rowLine) {
            let s = (rowLine || '').trim();
            if (s.startsWith('|')) s = s.slice(1);
            if (s.endsWith('|') && !s.endsWith('\\|')) s = s.slice(0, -1);
            const cells = [];
            let cur = '';
            for (let i = 0; i < s.length; i++) {
                if (s[i] === '\\' && i + 1 < s.length && s[i + 1] === '|') {
                    cur += '|';
                    i++;
                } else if (s[i] === '|') {
                    cells.push(cur.trim());
                    cur = '';
                } else {
                    cur += s[i];
                }
            }
            cells.push(cur.trim());
            return cells;
        }

        function isMarkdownTableSeparator(line) {
            const trimmed = (line || '').trim();
            if (!trimmed.startsWith('|') || !trimmed.includes('-')) return false;
            const cells = splitMarkdownTableRow(trimmed);
            return cells.length > 0 && cells.every(c => /^:?-{2,}:?$/.test(c.trim()));
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function parseSimpleInlineFormatting(text) {
            if (!text) return '';
            let t = escapeHtml(text);
            t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
            t = t.replace(/\*\*\*([^\n*]+?)\*\*\*/g, '<strong><em>$1</em></strong>');
            t = t.replace(/\*\*([^\n*]+?)\*\*/g, '<strong>$1</strong>');
            t = t.replace(/__([^\n_]+?)__/g, '<strong>$1</strong>');
            t = t.replace(/\*([^\s*](?:[^\n*]*?[^\s*])?)\*/g, '<em>$1</em>');
            t = t.replace(/(^|[\s(])_([^\s_](?:[^\n_]*?[^\s_])?)_(?=$|[\s.,;:!?)])/g, '$1<em>$2</em>');
            t = t.replace(/~~([^\n~]+?)~~/g, '<s>$1</s>');
            return t;
        }

        function markdownRowsToTableElement(rows) {
            if (!rows || rows.length < 2) return null;
            const headerCells = splitMarkdownTableRow(rows[0]);
            const sepCells = splitMarkdownTableRow(rows[1]);
            if (!sepCells.every(c => /^:?-{2,}:?$/.test(c.trim()))) return null;

            const aligns = sepCells.map(c => {
                const s = c.trim();
                if (s.startsWith(':') && s.endsWith(':')) return 'center';
                if (s.endsWith(':')) return 'right';
                return 'left';
            });

            const bodyLines = rows.slice(2);
            const container = document.createElement('div');
            container.className = 'table-container';

            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const trHead = document.createElement('tr');

            headerCells.forEach((h, idx) => {
                const th = document.createElement('th');
                if (aligns[idx] && aligns[idx] !== 'left') th.style.textAlign = aligns[idx];
                th.innerHTML = parseSimpleInlineFormatting(h);
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            bodyLines.forEach(bLine => {
                const trimmed = bLine.trim();
                if (!trimmed.startsWith('|')) return;
                if (isMarkdownTableSeparator(trimmed)) return;
                const bCells = splitMarkdownTableRow(trimmed);
                const tr = document.createElement('tr');
                headerCells.forEach((_, idx) => {
                    const td = document.createElement('td');
                    if (aligns[idx] && aligns[idx] !== 'left') td.style.textAlign = aligns[idx];
                    td.innerHTML = parseSimpleInlineFormatting(bCells[idx] ?? '');
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            container.appendChild(table);
            return container;
        }

        function convertMarkdownTablesInDOM(container) {
            if (!container) return;

            // 1. Multiline markdown tables inside single elements (e.g. <p>...<br>...</p> or <div>)
            const candidateElements = Array.from(container.querySelectorAll('p, div, blockquote'));
            candidateElements.forEach(el => {
                if (!el.isConnected) return;
                const htmlWithNewlines = el.innerHTML.replace(/<br\s*\/?>/gi, '\n');
                if (!htmlWithNewlines.includes('|') || !htmlWithNewlines.includes('-')) return;

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = htmlWithNewlines;
                const lines = tempDiv.textContent.replace(/\r\n?/g, '\n').split('\n').map(l => l.trim()).filter(Boolean);

                for (let i = 0; i < lines.length - 1; i++) {
                    if (lines[i].startsWith('|') && isMarkdownTableSeparator(lines[i + 1])) {
                        const tableRows = [lines[i], lines[i + 1]];
                        let j = i + 2;
                        while (j < lines.length && lines[j].startsWith('|')) {
                            if (!isMarkdownTableSeparator(lines[j])) {
                                tableRows.push(lines[j]);
                            }
                            j++;
                        }
                        const tableEl = markdownRowsToTableElement(tableRows);
                        if (tableEl) {
                            if (tableRows.length === lines.length) {
                                el.replaceWith(tableEl);
                            } else {
                                const beforeLines = lines.slice(0, i);
                                const afterLines = lines.slice(j);
                                const frag = document.createDocumentFragment();
                                if (beforeLines.length > 0) {
                                    const pBefore = document.createElement('p');
                                    pBefore.innerHTML = beforeLines.map(l => parseSimpleInlineFormatting(l)).join('<br>');
                                    frag.appendChild(pBefore);
                                }
                                frag.appendChild(tableEl);
                                if (afterLines.length > 0) {
                                    const pAfter = document.createElement('p');
                                    pAfter.innerHTML = afterLines.map(l => parseSimpleInlineFormatting(l)).join('<br>');
                                    frag.appendChild(pAfter);
                                }
                                el.replaceWith(frag);
                            }
                            break;
                        }
                    }
                }
            });

            // 2. Sibling elements where each row is in a separate <p> or <div>
            const children = Array.from(container.children);
            let idx = 0;
            while (idx < children.length - 1) {
                const cur = children[idx];
                const next = children[idx + 1];
                if (!cur || !next || !cur.isConnected || !next.isConnected) {
                    idx++;
                    continue;
                }
                const t0 = (cur.textContent || '').trim();
                const t1 = (next.textContent || '').trim();

                if (t0.startsWith('|') && isMarkdownTableSeparator(t1)) {
                    const tableRows = [t0, t1];
                    const elementsToRemove = [cur, next];
                    let scanIdx = idx + 2;
                    while (scanIdx < children.length) {
                        const sib = children[scanIdx];
                        const sibText = (sib.textContent || '').trim();
                        if (sibText.startsWith('|')) {
                            if (!isMarkdownTableSeparator(sibText)) {
                                tableRows.push(sibText);
                            }
                            elementsToRemove.push(sib);
                            scanIdx++;
                        } else {
                            break;
                        }
                    }

                    const tableEl = markdownRowsToTableElement(tableRows);
                    if (tableEl) {
                        cur.parentNode.insertBefore(tableEl, cur);
                        elementsToRemove.forEach(el => el.remove());
                        idx = scanIdx;
                        continue;
                    }
                }
                idx++;
            }
        }

        function isRawMarkdownDocument(text) {
            if (!text || typeof text !== 'string') return false;
            if (/<(p|div|h[1-6]|table|blockquote|ul|ol|pre|section|article)\b/i.test(text)) {
                return false;
            }
            const s = text.trim();
            if (!s) return false;
            if (/^#{1,6}\s+\S/m.test(s)) return true;
            if (/^(`{3,}|~{3,})\w*/m.test(s)) return true;
            if (/^\|.+\|\s*\n\s*\|[\s:|-]+\|/m.test(s)) return true;
            return false;
        }

        function convertRawMarkdownToHtml(mdText) {
            if (!mdText) return '';
            const lines = String(mdText).replace(/\r\n?/g, '\n').split('\n');
            const htmlParts = [];
            let i = 0;

            while (i < lines.length) {
                const line = lines[i];
                const trimmed = line.trim();

                if (!trimmed) {
                    i++;
                    continue;
                }

                // ATX Headings
                const headingMatch = line.match(/^\s*(#{1,6})\s+(.+?)\s*#*\s*$/);
                if (headingMatch) {
                    const level = Math.min(headingMatch[1].length, 6);
                    htmlParts.push(`<h${level}>${parseSimpleInlineFormatting(headingMatch[2])}</h${level}>`);
                    i++;
                    continue;
                }

                // Table
                if (trimmed.startsWith('|') && i + 1 < lines.length && isMarkdownTableSeparator(lines[i + 1])) {
                    const tableRows = [trimmed, lines[i + 1].trim()];
                    i += 2;
                    while (i < lines.length && lines[i].trim().startsWith('|')) {
                        if (!isMarkdownTableSeparator(lines[i])) {
                            tableRows.push(lines[i].trim());
                        }
                        i++;
                    }
                    const tableEl = markdownRowsToTableElement(tableRows);
                    if (tableEl) {
                        htmlParts.push(tableEl.outerHTML);
                    }
                    continue;
                }

                // Code block
                if (trimmed.startsWith('```')) {
                    const lang = trimmed.slice(3).trim();
                    const codeLines = [];
                    i++;
                    while (i < lines.length && !lines[i].trim().startsWith('```')) {
                        codeLines.push(lines[i]);
                        i++;
                    }
                    i++;
                    const headerHtml = buildViewerCodeHeader(lang || 'javascript').outerHTML;
                    htmlParts.push(`
                        <div class="code-block-wrapper">
                            ${headerHtml}
                            <textarea class="code" language="${escapeHtml(lang || 'javascript')}">${escapeHtml(codeLines.join('\n'))}</textarea>
                        </div>
                    `.trim());
                    continue;
                }

                // Regular paragraph
                const pLines = [trimmed];
                i++;
                while (i < lines.length && lines[i].trim() && !lines[i].trim().startsWith('#') && !lines[i].trim().startsWith('|') && !lines[i].trim().startsWith('```')) {
                    pLines.push(lines[i].trim());
                    i++;
                }
                htmlParts.push(`<p>${pLines.map(l => parseSimpleInlineFormatting(l)).join('<br>')}</p>`);
            }

            return htmlParts.join('\n');
        }

        function wrapBareTablesInDOM(container) {
            if (!container) return;
            const tables = container.querySelectorAll('table');
            tables.forEach(table => {
                const parent = table.parentElement;
                if (!parent || !parent.classList.contains('table-container')) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'table-container';
                    table.parentNode.insertBefore(wrapper, table);
                    wrapper.appendChild(table);
                }
            });
        }

        function initInteractiveElements(container) {
            upgradeLegacyBlocksInDOM(container);
            convertMarkdownTablesInDOM(container);
            wrapBareTablesInDOM(container);
            container.querySelectorAll(
                '.table-col-resizer, .code-block-wrapper .block-drag-handle, .code-block-wrapper .move-up-btn, .code-block-wrapper .move-down-btn, .code-block-wrapper .wrap-btn, .code-block-wrapper .code-action-btn.delete, .code-block-wrapper .lang-caret'
            ).forEach(el => el.remove());

            const codeBlocks = container.querySelectorAll('.code-block-wrapper');
            codeBlocks.forEach(wrapper => {
                const ta = wrapper.querySelector('textarea.code');
                if (!ta) return;

                const rawLang = ta.getAttribute('language') || 'javascript';
                const mode = mapLanguageMode(rawLang);
                const initialCode = ta.value || ta.textContent || '';
                ta.value = initialCode;

                const langTag = wrapper.querySelector('.code-lang-tag');
                if (langTag) {
                    langTag.classList.remove('clickable');
                    langTag.removeAttribute('onclick');
                    langTag.removeAttribute('title');

                    const rawLabel = (langTag.querySelector('.lang-name')?.textContent || langTag.textContent || '').trim();
                    const existingIcon = langTag.querySelector('.lang-icon');
                    const existingIconAttr = existingIcon ? (existingIcon.getAttribute('icon') || '') : '';
                    const hasValidIcon = /^[a-z0-9-]+:[a-z0-9-]+$/i.test(existingIconAttr);
                    const meta = getViewerLanguageMeta(rawLabel || rawLang);

                    if (!existingIcon || !hasValidIcon || !langTag.querySelector('.lang-name')) {
                        langTag.innerHTML = '';
                        const iconEl = document.createElement('iconify-icon');
                        iconEl.className = 'lang-icon';
                        iconEl.setAttribute('icon', hasValidIcon ? existingIconAttr : meta.icon);
                        const nameEl = document.createElement('span');
                        nameEl.className = 'lang-name';
                        nameEl.textContent = rawLabel || meta.name;
                        langTag.appendChild(iconEl);
                        langTag.appendChild(nameEl);
                    }
                } else if (!wrapper.querySelector('.code-block-header')) {
                    wrapper.insertBefore(buildViewerCodeHeader(rawLang), wrapper.firstChild);
                }

                let cm = null;
                if (window.CodeMirror) {
                    cm = CodeMirror.fromTextArea(ta, {
                        mode: mode,
                        theme: 'solarized',
                        readOnly: true,
                        lineNumbers: true,
                        lineWrapping: true,
                        tabSize: 4
                    });

                    if (!cm.getValue() && initialCode) {
                        cm.setValue(initialCode);
                    }

                    requestAnimationFrame(() => {
                        cm.refresh();
                    });
                    setTimeout(() => {
                        cm.refresh();
                    }, 50);
                    setTimeout(() => {
                        cm.refresh();
                    }, 250);
                }

                const copyBtn = wrapper.querySelector('.copy-btn');
                if (copyBtn) {
                    const copyIcon = copyBtn.querySelector('iconify-icon');
                    const copyIconAttr = copyIcon ? (copyIcon.getAttribute('icon') || '') : '';
                    if (!copyIcon || !/^[a-z0-9_-]+:[a-z0-9_-]+$/i.test(copyIconAttr)) {
                        copyBtn.innerHTML = '<iconify-icon icon="solar:copy-linear"></iconify-icon> Copy';
                    }
                    copyBtn.title = 'Copy Code';
                    const origHtml = copyBtn.innerHTML;
                    let copyResetTimer = null;
                    copyBtn.onclick = () => {
                        const code = cm ? cm.getValue() : (ta.value || ta.textContent || '');
                        navigator.clipboard.writeText(code).then(() => {
                            if (copyResetTimer) clearTimeout(copyResetTimer);
                            copyBtn.innerHTML = '<iconify-icon icon="solar:check-circle-bold" style="color:var(--success, #10b981)"></iconify-icon> Copied!';
                            copyResetTimer = setTimeout(() => {
                                copyBtn.innerHTML = origHtml;
                                copyResetTimer = null;
                            }, 1800);
                            showToast('Code copied to clipboard');
                        }).catch(e => {
                            console.error('Copy failed:', e);
                        });
                    };
                }
            });

            const checkboxes = container.querySelectorAll('.checklist-checkbox');
            checkboxes.forEach(cb => {
                cb.onchange = () => {
                    const item = cb.closest('.checklist-item');
                    if (item) {
                        item.classList.toggle('completed', cb.checked);
                    }
                };
            });

            if (window.katex) {
                container.querySelectorAll('.math-formula-block[data-latex], .math-formula-inline[data-latex]').forEach(el => {
                    const latex = el.getAttribute('data-latex') || '';
                    const isDisplay = el.getAttribute('data-display-mode') !== 'false' && el.classList.contains('math-formula-block');
                    if (latex) {
                        try {
                            el.innerHTML = window.katex.renderToString(latex, {
                                displayMode: isDisplay,
                                throwOnError: false,
                                strict: false
                            });
                        } catch (_) {}
                    }
                });
            }
        }

        window.addEventListener('DOMContentLoaded', fetchPublishedNote);
    </script>
</body>
</html>
