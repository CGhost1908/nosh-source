<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title>Nosh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: transparent;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .splash-card {
            width: 320px;
            height: 200px;
            background: #0e1015;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }
        .logo-wrap {
            position: relative;
            margin-bottom: 14px;
        }
        .logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }
        .app-name {
            font-size: 22px;
            font-weight: 700;
            color: #f3f4f6;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .app-sub {
            font-size: 11px;
            color: #6b7280;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .skeleton-bar-wrap {
            width: 140px;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }
        .skeleton-bar {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(90deg, transparent 0%, #6366f1 50%, transparent 100%);
            background-size: 200% 100%;
            animation: gradient-move 1.6s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.2); }
        }
        @keyframes gradient-move {
            0% { background-position: -200% 0%; }
            100% { background-position: 200% 0%; }
        }
    </style>
</head>
<body>
    <div class="splash-card">
        <div class="logo-wrap">
            <img class="logo" src="icon.png" alt="Nosh">
        </div>
        <div class="app-name">nosh</div>
        <div class="app-sub">Initialising workspace...</div>
        <div class="skeleton-bar-wrap">
            <div class="skeleton-bar"></div>
        </div>
    </div>
</body>
</html>
